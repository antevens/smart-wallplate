# PSU carrier netlist (source of truth for the schematic).
# The KiCad generators read pcb/tools/parts.py; keep the two in sync by hand.
# Net names in KiCad: /L_IN, /L_F, /N (local labels), +5V, GND (power symbols).
components:
  J1:  {value: "MKDS 1,5/2-5,08", mfr: "Phoenix Contact", mpn: "1715721", rating: "400 V / 17.5 A (Phoenix)",
        role: "mains in: 1=L' (load side of rocker), 2=N", footprint: "MKDS 5.08 horizontal, pads reduced to 2.4 mm"}
  F1:  {value: "T1A 250V time-lag", mfr: "Littelfuse", mpn: "39211000000", package: "TR5 (392 series, IEC 60127-3)",
        note: "rating is the designer's choice: Mean Well's IRM-03 spec and PCB installation manual give none; inrush 20 A typ @230 VAC. HUMAN REVIEW."}
  RV1: {value: "S07K275 (275 VAC)", mfr: "TDK", mpn: "B72207S0271K101", package: "disc 7 mm, P5.0 mm, 4.4 mm thick"}
  PS1: {value: "Mean Well IRM-03-5", pins: {1: AC/L, 3: AC/N, 14: -Vo, 16: +Vo, 5: NC},
        source: "https://www.meanwell.com/Upload/PDF/IRM-03/IRM-03-SPEC.PDF (2025-08-08)"}
  C1:  {value: "47uF 16V", mfr: "Panasonic", mpn: "EEU-FC1C470", package: "radial 5x11 mm P2.0",
        note: "datasheet ripple is measured with 47 uF || 0.1 uF; populated"}
  J2:  {value: "JST-XH 2p", mfr: "JST", mpn: "B2B-XH-A(LF)(SN)", role: "1=+5V, 2=GND to MSR-2"}
nets:
  L_IN:  [J1.1, F1.1]                 # netclass Primary
  L_F:   [F1.2, RV1.1, PS1.1]         # netclass Primary
  N:     [J1.2, RV1.2, PS1.3]         # netclass Primary
  +5V:   [PS1.16, C1.1, J2.1]         # netclass Secondary
  GND:   [PS1.14, C1.2, J2.2]         # netclass Secondary
  NC:    [PS1.5]                      # datasheet NC, left open (secondary end of the module)
